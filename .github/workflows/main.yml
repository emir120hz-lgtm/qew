name: Build Kuro Launcher
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compile
        shell: bash
        run: |
          mkdir out dist
          javac -d out Kuro.java
          printf 'Main-Class: Kuro\n' > manifest.txt
          jar cfm dist/KuroLauncher.jar manifest.txt -C out .
      - name: Portable app (Kuro.exe, Java dahil)
        shell: bash
        run: |
          jpackage --type app-image --name Kuro --input dist \
            --main-jar KuroLauncher.jar --main-class Kuro --dest pkg
          powershell Compress-Archive -Path pkg/Kuro -DestinationPath Kuro-Portable.zip
      - name: Installer (Kuro-Setup.exe)
        shell: bash
        continue-on-error: true
        run: |
          jpackage --type exe --name Kuro --input dist \
            --main-jar KuroLauncher.jar --main-class Kuro --dest installer \
            --win-shortcut --win-menu --win-dir-chooser
      - uses: actions/upload-artifact@v4
        with:
          name: Kuro
          path: |
            Kuro-Portable.zip
            installer/*.exe
